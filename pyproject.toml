[project]
name = "sukashi"
version = "0.1.0"
description = "From-scratch implementation of LLM text watermarking (KGW and Gumbel-Max) with detection and paraphrase-attack experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.33",
    "sentence-transformers>=5.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sukashi"]

[dependency-groups]
dev = [
    "protobuf>=7.35.1",
    "pytest>=9.1.1",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.13.0",
]
