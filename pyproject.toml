[project]
name = "llm-watermark-lab"
version = "0.1.0"
description = "From-scratch implementation of LLM text watermarking (KGW and Gumbel-Max) with detection and paraphrase-attack experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_watermark_lab"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
